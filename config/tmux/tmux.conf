set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

set -g mouse on
set -g focus-events on
set -g escape-time 10
set -g history-limit 1000000

set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @resurrect-dir "~/.tmux/resurrect"

set -g status 2
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 0
set -g status-right-length 80
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left ""
set -g status-right "#[fg=#7aa2f7] #{pane_current_path} "
set -g status-justify left
set -g status-format[0] "#[bg=#1a1b26] "
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{E:window-status-current-style}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set -g window-status-separator ""
set -g window-status-format "#[fg=#6f82b8] #I: #W "
set -g window-status-current-format "#[fg=#7aa2f7,bold] #I: #W #[default]"
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#33467c,fg=#c0caf5"

bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key w kill-pane

bind-key -n M-Left previous-window
bind-key -n M-Right next-window

bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# tmux owns mouse scrollback. Drag selections are copied to the macOS
# clipboard on release so copy/paste remains predictable inside tmux.
bind-key -T root MouseDrag1Pane copy-mode -M
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"

if-shell -b '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run -b "~/.tmux/plugins/tpm/tpm"'
