"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
$git_state\
[](fg:#394260)\
$character"""

right_format = "$status$cmd_duration$jobs"

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[git_state]
style = "fg:#e0af68 bg:#394260"
format = '[[ $state( $progress_current/$progress_total)]($style)]'

[status]
disabled = false
format = '[$symbol$status ]($style)'
symbol = "✘ "
style = "bold #f7768e"

[cmd_duration]
min_time = 2_000
format = '[took $duration ](bold #e0af68)'

[jobs]
symbol = "✦ "
format = '[$symbol$number]($style)'
style = "bold #7aa2f7"

[character]
success_symbol = "[❯](bold #769ff0)"
error_symbol = "[❯](bold #f7768e)"
