default_install_hook_types: ["pre-commit", "commit-msg"]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: local
    hooks:
      - id: bash-syntax
        name: bash syntax
        entry: bash -n
        language: system
        files: ^(scripts/.*\.sh|config/yabai/yabairc)$

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: ^(scripts/.*\.sh|config/yabai/yabairc)$

      - id: shfmt
        name: shfmt
        entry: shfmt -w
        language: system
        files: ^(scripts/.*\.sh|config/yabai/yabairc)$

      - id: zsh-syntax
        name: zsh syntax
        entry: zsh -n
        language: system
        files: ^home/\.z(shrc|profile|shenv)$

      - id: ghostty-validate-config
        name: ghostty validate config
        entry: ghostty +validate-config --config-file=config/ghostty/config
        language: system
        files: ^config/ghostty/config$
        pass_filenames: false

      - id: starship-explain
        name: starship explain
        entry: bash -c 'STARSHIP_CONFIG=config/starship/starship.toml starship explain >/dev/null'
        language: system
        files: ^config/starship/starship\.toml$
        pass_filenames: false

      - id: tmux-validate-config
        name: tmux validate config
        entry: tmux -L ghostship-precommit -f config/tmux/tmux.conf start-server ; source-file config/tmux/tmux.conf ; kill-server
        language: system
        files: ^config/tmux/tmux\.conf$
        pass_filenames: false

  - repo: https://github.com/crate-ci/typos
    rev: v1.46.2
    hooks:
      - id: typos

  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed
